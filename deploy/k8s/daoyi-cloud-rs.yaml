---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: daoyi-cloud-rs
  labels:
    app: daoyi-cloud-rs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: daoyi-cloud-rs
  template:
    metadata:
      labels:
        app: daoyi-cloud-rs
    spec:
      containers:
        - name: daoyi-cloud-rs
          image: daoyi-cloud/daoyi-cloud-rs:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 38080
              name: http
          env:
            - name: APP_AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: daoyi-secrets
                  key: jwt_secret
            - name: APP_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: daoyi-secrets
                  key: db_password
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "500m"
            limits:
              memory: "512Mi"
              cpu: "1000m"

---
apiVersion: v1
kind: Service
metadata:
  name: daoyi-cloud-rs
  labels:
    app: daoyi-cloud-rs
spec:
  selector:
    app: daoyi-cloud-rs
  ports:
    - protocol: TCP
      port: 80
      targetPort: 38080
      name: http
  type: LoadBalancer
