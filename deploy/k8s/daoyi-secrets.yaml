# Secret 示例文件——请勿提交明文密码到版本控制
# 使用 kubectl create secret 或 SealedSecret 管理实际值
#
# 创建方式：
#   kubectl create secret generic daoyi-secrets \
#     --from-literal=jwt_secret='<your-256-bit-secret>' \
#     --from-literal=db_password='<your-db-password>'
---
apiVersion: v1
kind: Secret
metadata:
  name: daoyi-secrets
  labels:
    app: daoyi-cloud-rs
type: Opaque
stringData:
  jwt_secret: ""
  db_password: ""
