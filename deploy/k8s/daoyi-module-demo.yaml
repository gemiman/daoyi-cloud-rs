---
apiVersion: v1
kind: ConfigMap
metadata:
  name: daoyi-demo-config
  labels:
    app: daoyi-module-demo
data:
  application-demo.yaml: |
    server:
      port: 28080
    database:
      host: mysql-service
      port: 3306
      user: root
      password: ${DB_PASSWORD}
      database: demo
      pool:
        min_connections: 2
        max_connections: 10
    auth:
      ignore_urls:
        - "**/login"
        - "**/health"
      jwt:
        secret: ""
        expiration_secs: 3600
        audience: "daoyi-cloud"
        issuer: "daoyi-cloud"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: daoyi-module-demo
  labels:
    app: daoyi-module-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: daoyi-module-demo
  template:
    metadata:
      labels:
        app: daoyi-module-demo
    spec:
      containers:
        - name: daoyi-module-demo
          image: daoyi-cloud/daoyi-module-demo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 28080
              name: http
          env:
            - name: APP_CONFIG_PATH
              value: /app/config/application-demo.yaml
            - name: APP_AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: daoyi-secrets
                  key: jwt_secret
            - name: APP_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: daoyi-secrets
                  key: db_password
          volumeMounts:
            - name: config
              mountPath: /app/config
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      volumes:
        - name: config
          configMap:
            name: daoyi-demo-config

---
apiVersion: v1
kind: Service
metadata:
  name: daoyi-module-demo
  labels:
    app: daoyi-module-demo
spec:
  selector:
    app: daoyi-module-demo
  ports:
    - protocol: TCP
      port: 80
      targetPort: 28080
      name: http
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: daoyi-module-demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: daoyi-module-demo
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
