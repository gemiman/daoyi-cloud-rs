server:
  port: 28080
  cors:
    allowed_origins: [ ]
    allowed_methods: [ ]
    allowed_headers: [ ]
    allow_credentials: false
    max_age_secs: 43200

database:
  host: 127.0.0.1
  port: 3306
  user: root
  password: 123456
  database: demo
  pool:
    min_connections: 2
    max_connections: 10
    connect_timeout_secs: 30
    acquire_timeout_secs: 30
    idle_timeout_secs: 60
    max_lifetime_secs: 300
    sqlx_logging: false

auth:
  ignore_urls:
    - "**/login"
    - "**/health"
  jwt:
    secret: "123"
    expiration_secs: 3600
    audience: "daoyi-cloud"
    issuer: "daoyi-cloud"
